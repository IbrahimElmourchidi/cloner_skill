[package]
name = "clone-site"
version = "1.1.0"
edition = "2021"
rust-version = "1.74"
description = "Builds a step-by-step teaching site from a repository. One HTML page per source file."
license = "MIT"

[[bin]]
name = "clone-site"
path = "src/main.rs"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
regex = "1"
# A spec-compliant HTML tokenizer, so tag-balance findings are the real ones
# rather than whatever a hand-rolled tag matcher happens to believe. The
# reference implementation used the platform parser, and a validator that
# disagrees with a browser about what is markup is not a validator.
html5ever = "0.27"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true